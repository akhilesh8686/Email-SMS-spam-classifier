<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpamScan — Classifier</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset & Vars ───────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #05070d;
      --surface:   #0b0f1a;
      --border:    #1a2540;
      --primary:   #00e5ff;
      --danger:    #ff2d55;
      --safe:      #00ff99;
      --text:      #c8d8f0;
      --muted:     #4a5f80;
      --font-mono: 'Share Tech Mono', monospace;
      --font-ui:   'Rajdhani', sans-serif;
      --glow-cyan: 0 0 18px rgba(0,229,255,.45);
      --glow-red:  0 0 18px rgba(255,45,85,.5);
      --glow-grn:  0 0 18px rgba(0,255,153,.45);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      overflow-x: hidden;
    }

    /* ── Animated grid background ───────────────────────────── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,229,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Floating orbs ──────────────────────────────────────── */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
      animation: drift 12s ease-in-out infinite alternate;
    }
    .orb-1 { width: 420px; height: 420px; background: rgba(0,229,255,.07); top: -120px; left: -100px; }
    .orb-2 { width: 320px; height: 320px; background: rgba(255,45,85,.07); bottom: -80px; right: -60px; animation-delay: -6s; }

    @keyframes drift {
      from { transform: translate(0,0) scale(1); }
      to   { transform: translate(30px, 20px) scale(1.06); }
    }

    /* ── Layout ─────────────────────────────────────────────── */
    .wrapper {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    /* ── Header ─────────────────────────────────────────────── */
    header {
      text-align: center;
      margin-bottom: 2.5rem;
      animation: fadeDown .6s ease both;
    }

    .logo-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .7rem;
      margin-bottom: .4rem;
    }

    .logo-icon {
      width: 36px; height: 36px;
      border: 2px solid var(--primary);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-mono);
      font-size: .75rem;
      color: var(--primary);
      box-shadow: var(--glow-cyan), inset 0 0 8px rgba(0,229,255,.15);
      letter-spacing: 1px;
    }

    h1 {
      font-family: var(--font-ui);
      font-size: clamp(2rem, 6vw, 3.2rem);
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--primary);
      text-shadow: var(--glow-cyan);
    }

    .tagline {
      font-family: var(--font-mono);
      font-size: .78rem;
      color: var(--muted);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: .25rem;
    }

    /* ── Card ───────────────────────────────────────────────── */
    .card {
      width: 100%;
      max-width: 640px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.2rem 2.4rem;
      position: relative;
      overflow: hidden;
      animation: fadeUp .7s ease .1s both;
      box-shadow: 0 0 0 1px rgba(0,229,255,.06), 0 24px 60px rgba(0,0,0,.6);
    }

    /* Corner decorations */
    .card::before, .card::after {
      content: '';
      position: absolute;
      width: 18px; height: 18px;
      border-color: var(--primary);
      border-style: solid;
      opacity: .55;
    }
    .card::before { top: 10px; left: 10px;  border-width: 2px 0 0 2px; }
    .card::after  { bottom: 10px; right: 10px; border-width: 0 2px 2px 0; }

    /* ── Section label ──────────────────────────────────────── */
    .section-label {
      font-family: var(--font-mono);
      font-size: .7rem;
      letter-spacing: 3px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: .6rem;
    }

    /* ── Textarea ───────────────────────────────────────────── */
    .input-wrap {
      position: relative;
      margin-bottom: 1.4rem;
    }

    textarea {
      width: 100%;
      height: 150px;
      resize: vertical;
      background: rgba(0,229,255,.03);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.1rem;
      font-family: var(--font-mono);
      font-size: .88rem;
      color: var(--text);
      outline: none;
      line-height: 1.7;
      transition: border-color .25s, box-shadow .25s;
      caret-color: var(--primary);
    }

    textarea::placeholder { color: var(--muted); }

    textarea:focus {
      border-color: rgba(0,229,255,.4);
      box-shadow: 0 0 0 3px rgba(0,229,255,.08), var(--glow-cyan);
    }

    /* char counter */
    .char-count {
      position: absolute;
      bottom: .5rem; right: .8rem;
      font-family: var(--font-mono);
      font-size: .65rem;
      color: var(--muted);
    }

    /* ── Predict Button ─────────────────────────────────────── */
    .btn-predict {
      width: 100%;
      padding: .9rem;
      background: transparent;
      border: 1px solid var(--primary);
      border-radius: 10px;
      color: var(--primary);
      font-family: var(--font-ui);
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: background .2s, box-shadow .2s, color .2s;
    }

    .btn-predict::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--primary);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform .3s ease;
      z-index: 0;
    }

    .btn-predict:hover::before { transform: scaleX(1); }
    .btn-predict:hover { color: var(--bg); box-shadow: var(--glow-cyan); }

    .btn-predict span { position: relative; z-index: 1; }

    .btn-predict:disabled {
      opacity: .45;
      cursor: not-allowed;
    }
    .btn-predict:disabled::before { display: none; }

    /* ── Loading dots ───────────────────────────────────────── */
    .loader { display: none; gap: 5px; align-items: center; justify-content: center; }
    .loader.active { display: flex; }
    .loader span {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--primary);
      animation: bounce 1s infinite;
    }
    .loader span:nth-child(2) { animation-delay: .15s; }
    .loader span:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce { 0%,80%,100%{ transform:scale(1); } 40%{ transform:scale(1.6); } }

    /* ── Result panel ───────────────────────────────────────── */
    .result-panel {
      margin-top: 1.5rem;
      padding: 1.4rem 1.5rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      display: none;
      animation: popIn .4s cubic-bezier(.34,1.56,.64,1) both;
      position: relative;
      overflow: hidden;
    }

    .result-panel.visible { display: block; }

    .result-panel.spam  { border-color: rgba(255,45,85,.4);  background: rgba(255,45,85,.06);  }
    .result-panel.ham   { border-color: rgba(0,255,153,.4);  background: rgba(0,255,153,.06);  }
    .result-panel.error { border-color: rgba(255,165,0,.4);  background: rgba(255,165,0,.06);  }

    /* scan line animation */
    .result-panel::after {
      content: '';
      position: absolute;
      top: -100%; left: 0; right: 0;
      height: 60px;
      background: linear-gradient(transparent, rgba(255,255,255,.03), transparent);
      animation: scan 1.5s ease forwards;
    }

    @keyframes scan {
      from { top: -100%; }
      to   { top: 110%; }
    }

    .result-header {
      display: flex;
      align-items: center;
      gap: .8rem;
      margin-bottom: .6rem;
    }

    .verdict-icon {
      font-size: 1.6rem;
      line-height: 1;
    }

    .verdict-text {
      font-family: var(--font-ui);
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .spam  .verdict-text { color: var(--danger); text-shadow: var(--glow-red); }
    .ham   .verdict-text { color: var(--safe);   text-shadow: var(--glow-grn); }
    .error .verdict-text { color: #ffaa00; }

    .verdict-sub {
      font-family: var(--font-mono);
      font-size: .75rem;
      color: var(--muted);
      letter-spacing: 1px;
    }

    /* confidence bar */
    .conf-wrap {
      margin-top: .9rem;
    }

    .conf-label {
      font-family: var(--font-mono);
      font-size: .65rem;
      color: var(--muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: .35rem;
    }

    .conf-bar {
      height: 5px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
    }

    .conf-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 1s ease;
      width: 0%;
    }

    .spam .conf-fill { background: var(--danger); box-shadow: var(--glow-red); }
    .ham  .conf-fill { background: var(--safe);   box-shadow: var(--glow-grn); }

    .conf-value {
      font-family: var(--font-mono);
      font-size: .7rem;
      color: var(--muted);
      margin-top: .3rem;
      text-align: right;
    }

    /* ── Clear button ───────────────────────────────────────── */
    .btn-clear {
      display: block;
      margin: 1rem auto 0;
      background: none;
      border: none;
      font-family: var(--font-mono);
      font-size: .72rem;
      color: var(--muted);
      letter-spacing: 2px;
      cursor: pointer;
      text-transform: uppercase;
      transition: color .2s;
    }
    .btn-clear:hover { color: var(--text); }

    /* ── Footer ─────────────────────────────────────────────── */
    footer {
      margin-top: 2rem;
      font-family: var(--font-mono);
      font-size: .65rem;
      color: var(--muted);
      letter-spacing: 2px;
      text-align: center;
      animation: fadeUp .8s ease .3s both;
    }

    /* ── Keyframes ──────────────────────────────────────────── */
    @keyframes fadeDown { from { opacity:0; transform:translateY(-20px); } to { opacity:1; transform:translateY(0); } }
    @keyframes fadeUp   { from { opacity:0; transform:translateY(20px);  } to { opacity:1; transform:translateY(0); } }
    @keyframes popIn    { from { opacity:0; transform:scale(.9);          } to { opacity:1; transform:scale(1);    } }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="wrapper">
    <header>
      <div class="logo-line">
        <div class="logo-icon">SX</div>
        <h1>SpamScan</h1>
      </div>
      <p class="tagline">AI-powered SMS &amp; Email Threat Detector</p>
    </header>

    <div class="card">
      <p class="section-label">// input message</p>

      <div class="input-wrap">
        <textarea
          id="msgInput"
          placeholder="Paste your SMS or email content here…"
          maxlength="2000"
          oninput="updateCount()"
        ></textarea>
        <span class="char-count" id="charCount">0 / 2000</span>
      </div>

      <button class="btn-predict" id="predictBtn" onclick="predict()">
        <span id="btnText">⚡ Analyse Message</span>
        <div class="loader" id="loader">
          <span></span><span></span><span></span>
        </div>
      </button>

      <div class="result-panel" id="resultPanel">
        <div class="result-header">
          <div class="verdict-icon" id="verdictIcon"></div>
          <div>
            <div class="verdict-text" id="verdictText"></div>
            <div class="verdict-sub" id="verdictSub"></div>
          </div>
        </div>
        <div class="conf-wrap" id="confWrap">
          <div class="conf-label">// confidence score</div>
          <div class="conf-bar"><div class="conf-fill" id="confFill"></div></div>
          <div class="conf-value" id="confValue"></div>
        </div>
      </div>

      <button class="btn-clear" id="clearBtn" onclick="clearAll()" style="display:none;">
        [ clear &amp; reset ]
      </button>
    </div>

    <footer>spamscan v1.0 &nbsp;·&nbsp; ml-powered &nbsp;·&nbsp; built with flask</footer>
  </div>

  <script>
    function updateCount() {
      const ta = document.getElementById('msgInput');
      document.getElementById('charCount').textContent = ta.value.length + ' / 2000';
    }

    async function predict() {
      const msg = document.getElementById('msgInput').value.trim();
      if (!msg) {
        shake(document.getElementById('msgInput'));
        return;
      }

      // UI → loading state
      const btn    = document.getElementById('predictBtn');
      const btnTxt = document.getElementById('btnText');
      const loader = document.getElementById('loader');
      btn.disabled = true;
      btnTxt.style.display = 'none';
      loader.classList.add('active');

      // Hide old result
      const panel = document.getElementById('resultPanel');
      panel.className = 'result-panel';

      try {
        const res  = await fetch('/predict', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ message: msg })
        });
        const data = await res.json();

        if (data.error) {
          showResult('error', '⚠', 'Input Error', data.error, null);
        } else {
          const isSpam = data.label === 'spam';
          showResult(
            isSpam ? 'spam' : 'ham',
            isSpam ? '🚨' : '✅',
            isSpam ? 'SPAM DETECTED' : 'NOT SPAM',
            isSpam
              ? 'This message shows signs of spam or phishing.'
              : 'This message appears legitimate.',
            data.confidence
          );
        }
      } catch (e) {
        showResult('error', '⚠', 'SERVER ERROR', 'Could not reach the server.', null);
      } finally {
        btn.disabled = false;
        btnTxt.style.display = '';
        loader.classList.remove('active');
        document.getElementById('clearBtn').style.display = 'block';
      }
    }

    function showResult(type, icon, title, sub, confidence) {
      const panel  = document.getElementById('resultPanel');
      panel.className = 'result-panel visible ' + type;
      document.getElementById('verdictIcon').textContent = icon;
      document.getElementById('verdictText').textContent = title;
      document.getElementById('verdictSub').textContent  = sub;

      const confWrap = document.getElementById('confWrap');
      if (confidence !== null && confidence !== undefined) {
        confWrap.style.display = 'block';
        document.getElementById('confValue').textContent = confidence + '% confidence';
        // Animate bar after a tick so CSS transition fires
        setTimeout(() => {
          document.getElementById('confFill').style.width = confidence + '%';
        }, 80);
      } else {
        confWrap.style.display = 'none';
      }
    }

    function clearAll() {
      document.getElementById('msgInput').value = '';
      document.getElementById('charCount').textContent = '0 / 2000';
      document.getElementById('resultPanel').className = 'result-panel';
      document.getElementById('confFill').style.width = '0%';
      document.getElementById('clearBtn').style.display = 'none';
    }

    function shake(el) {
      el.style.animation = 'none';
      el.offsetHeight;          // reflow
      el.style.animation = 'shakeX .4s ease';
    }

    // inline shake keyframes
    const s = document.createElement('style');
    s.textContent = `@keyframes shakeX {
      0%,100%{transform:translateX(0)}
      20%{transform:translateX(-8px)}
      40%{transform:translateX(8px)}
      60%{transform:translateX(-5px)}
      80%{transform:translateX(5px)}
    }`;
    document.head.appendChild(s);

    // Allow Ctrl+Enter to submit
    document.getElementById('msgInput').addEventListener('keydown', e => {
      if (e.key === 'Enter' && e.ctrlKey) predict();
    });
  </script>
</body>
</html>
